<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Where miner emission actually goes">
<style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .t-title { font-size: 15px; font-weight: 600; }
    .t-sub { font-size: 11.5px; }
    .t-lab { font-size: 11px; }
    .t-val { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .t-tick { font-size: 10.5px; font-variant-numeric: tabular-nums; }

    .surface { fill: #fcfcfb; }
    .ink { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .muted { fill: #898781; }
    .grid { stroke: #e1e0d9; }
    .axis { stroke: #c3c2b7; }
    .accent { fill: #2a78d6; }
    .critical { fill: #d03b3b; }
    .deemph { fill: #d8d7d0; }

    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink { fill: #ffffff; }
      .ink2 { fill: #c3c2b7; }
      .muted { fill: #898781; }
      .grid { stroke: #2c2c2a; }
      .axis { stroke: #383835; }
      .accent { fill: #3987e5; }
      .deemph { fill: #3a3a37; }
    }
</style>
<rect class="surface" width="760" height="300" rx="8"/>
<text class="ink t-title" x="20" y="28">Where miner emission actually goes</text>
<text class="muted t-sub" x="20" y="46">128 subnets. The two ends are what matter: 57 burn nothing, 36 burn everything.</text>
<text class="ink2 t-lab" x="118" y="90" text-anchor="end">0 (none)</text>
<path class="accent" d="M128.0,74.0 H666.0 a4.0,4.0 0 0 1 4.0,4.0 V94.0 a4.0,4.0 0 0 1 -4.0,4.0 H128.0 Z"/>
<text class="ink2 t-val" x="678.0" y="90">57</text>
<text class="ink2 t-lab" x="118" y="122" text-anchor="end">0–0.2</text>
<path class="accent" d="M128.0,106.0 H171.5 a4.0,4.0 0 0 1 4.0,4.0 V126.0 a4.0,4.0 0 0 1 -4.0,4.0 H128.0 Z"/>
<text class="ink2 t-val" x="183.5" y="122">5</text>
<text class="ink2 t-lab" x="118" y="154" text-anchor="end">0.2–0.4</text>
<path class="accent" d="M128.0,138.0 H171.5 a4.0,4.0 0 0 1 4.0,4.0 V158.0 a4.0,4.0 0 0 1 -4.0,4.0 H128.0 Z"/>
<text class="ink2 t-val" x="183.5" y="154">5</text>
<text class="ink2 t-lab" x="118" y="186" text-anchor="end">0.4–0.6</text>
<path class="accent" d="M128.0,170.0 H209.6 a4.0,4.0 0 0 1 4.0,4.0 V190.0 a4.0,4.0 0 0 1 -4.0,4.0 H128.0 Z"/>
<text class="ink2 t-val" x="221.6" y="186">9</text>
<text class="ink2 t-lab" x="118" y="218" text-anchor="end">0.6–0.8</text>
<path class="accent" d="M128.0,202.0 H181.1 a4.0,4.0 0 0 1 4.0,4.0 V222.0 a4.0,4.0 0 0 1 -4.0,4.0 H128.0 Z"/>
<text class="ink2 t-val" x="193.1" y="218">6</text>
<text class="ink2 t-lab" x="118" y="250" text-anchor="end">0.8–0.99</text>
<path class="accent" d="M128.0,234.0 H219.1 a4.0,4.0 0 0 1 4.0,4.0 V254.0 a4.0,4.0 0 0 1 -4.0,4.0 H128.0 Z"/>
<text class="ink2 t-val" x="231.1" y="250">10</text>
<text class="ink2 t-lab" x="118" y="282" text-anchor="end">≥0.99 dead</text>
<path class="critical" d="M128.0,266.0 H466.3 a4.0,4.0 0 0 1 4.0,4.0 V286.0 a4.0,4.0 0 0 1 -4.0,4.0 H128.0 Z"/>
<text class="ink t-val" x="478.3" y="282">36</text>
<line class="axis" x1="128" y1="68" x2="128" y2="292" stroke-width="1"/>
<text class="muted t-tick" x="20" y="286">A subnet at ≥0.99 pays miners nothing, whatever its headline income says.</text>
</svg>
