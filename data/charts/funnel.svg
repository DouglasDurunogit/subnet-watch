<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" viewBox="0 0 760 268" role="img" aria-label="How many subnets survive each filter">
<style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .t-title { font-size: 15px; font-weight: 600; }
    .t-sub { font-size: 11.5px; }
    .t-lab { font-size: 11px; }
    .t-val { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .t-tick { font-size: 10.5px; font-variant-numeric: tabular-nums; }

    .surface { fill: #fcfcfb; }
    .ink { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .muted { fill: #898781; }
    .grid { stroke: #e1e0d9; }
    .axis { stroke: #c3c2b7; }
    .accent { fill: #2a78d6; }
    .critical { fill: #d03b3b; }
    .deemph { fill: #d8d7d0; }

    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink { fill: #ffffff; }
      .ink2 { fill: #c3c2b7; }
      .muted { fill: #898781; }
      .grid { stroke: #2c2c2a; }
      .axis { stroke: #383835; }
      .accent { fill: #3987e5; }
      .deemph { fill: #3a3a37; }
    }
</style>
<rect class="surface" width="760" height="268" rx="8"/>
<text class="ink t-title" x="20" y="28">How many subnets survive each filter</text>
<text class="muted t-sub" x="20" y="46">Of 128 subnets, 16 clear every gate with hardware evidence to back the margin.</text>
<text class="ink2 t-lab" x="166" y="91" text-anchor="end">All subnets</text>
<path class="deemph" d="M176.0,74.0 H660.0 a4.0,4.0 0 0 1 4.0,4.0 V96.0 a4.0,4.0 0 0 1 -4.0,4.0 H176.0 Z"/>
<path class="accent" d="M176.0,74.0 H660.0 a4.0,4.0 0 0 1 4.0,4.0 V96.0 a4.0,4.0 0 0 1 -4.0,4.0 H176.0 Z"/>
<text class="ink t-val" x="674" y="91">128</text>
<text class="ink2 t-lab" x="166" y="127" text-anchor="end">Not 100% burned</text>
<path class="deemph" d="M176.0,110.0 H660.0 a4.0,4.0 0 0 1 4.0,4.0 V132.0 a4.0,4.0 0 0 1 -4.0,4.0 H176.0 Z"/>
<path class="accent" d="M176.0,110.0 H541.8 a4.0,4.0 0 0 1 4.0,4.0 V132.0 a4.0,4.0 0 0 1 -4.0,4.0 H176.0 Z"/>
<text class="ink t-val" x="674" y="127">97</text>
<text class="ink2 t-lab" x="166" y="163" text-anchor="end">Registration open</text>
<path class="deemph" d="M176.0,146.0 H660.0 a4.0,4.0 0 0 1 4.0,4.0 V168.0 a4.0,4.0 0 0 1 -4.0,4.0 H176.0 Z"/>
<path class="accent" d="M176.0,146.0 H541.8 a4.0,4.0 0 0 1 4.0,4.0 V168.0 a4.0,4.0 0 0 1 -4.0,4.0 H176.0 Z"/>
<text class="ink t-val" x="674" y="163">97</text>
<text class="ink2 t-lab" x="166" y="199" text-anchor="end">Positive margin</text>
<path class="deemph" d="M176.0,182.0 H660.0 a4.0,4.0 0 0 1 4.0,4.0 V204.0 a4.0,4.0 0 0 1 -4.0,4.0 H176.0 Z"/>
<path class="accent" d="M176.0,182.0 H393.1 a4.0,4.0 0 0 1 4.0,4.0 V204.0 a4.0,4.0 0 0 1 -4.0,4.0 H176.0 Z"/>
<text class="ink t-val" x="674" y="199">58</text>
<text class="ink2 t-lab" x="166" y="235" text-anchor="end">+ hardware evidence</text>
<path class="deemph" d="M176.0,218.0 H660.0 a4.0,4.0 0 0 1 4.0,4.0 V240.0 a4.0,4.0 0 0 1 -4.0,4.0 H176.0 Z"/>
<path class="accent" d="M176.0,218.0 H233.0 a4.0,4.0 0 0 1 4.0,4.0 V240.0 a4.0,4.0 0 0 1 -4.0,4.0 H176.0 Z"/>
<text class="ink t-val" x="674" y="235">16</text>
<text class="muted t-tick" x="20" y="254">"Positive margin" already nets off the cheapest machine that meets the requirement.</text>
</svg>
