name: sweep

# Hourly chain + GitHub sweep. Publishes data/ to the default branch so ChatGPT
# can read it over plain raw.githubusercontent.com with no auth.
#
# Two scheduling facts baked in here:
#   * GitHub disables cron workflows in public repos after 60 days with no
#     commits. This workflow commits on most runs, but bot commits do not
#     reliably reset that timer, so `keepalive` below forces a dated marker
#     commit when the tree is otherwise unchanged.
#   * cron is best-effort and can slip 5-30 min at peak. That is fine: subnet
#     tempo is 72 min, and the alarm window carries a 15 min overlap. If you
#     change this schedule, change watch_interval_minutes in data/config.json
#     in the SAME commit or events report late.

on:
  schedule:
    - cron: "7,27,47 * * * *"      # hourly at :07, off the peak-of-hour stampede
  workflow_dispatch:          # manual "Run workflow" button
    inputs:
      skip_github:
        description: "Chain only (much faster; leaves GitHub columns as-is)"
        type: boolean
        default: false

concurrency:
  group: sweep               # never let a slow run overlap the next hour's
  cancel-in-progress: false  # let the running sweep finish; skip the new one

permissions:
  contents: write            # required to commit data/ back

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # a hung websocket must not burn the hour

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2     # need the parent to diff for the keepalive check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          pip install -q "bittensor==10.5.0" requests

      - name: Self-test
        # Runs before the sweep on purpose. These lock in the failure modes that
        # would otherwise degrade the feed silently -- epoch ticks read as new
        # challenges, template min_compute quoted as a requirement, missing data
        # imputed. A broken detector must not publish.
        run: |
          pip install -q pytest
          python -m pytest tests/ -q

      - name: Sweep
        id: sweep
        run: |
          if [ "${{ inputs.skip_github }}" = "true" ]; then
            python -m collector.run --skip-github
          else
            python -m collector.run
          fi

      - name: Commit
        run: |
          git config user.name  "subnet-watch"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/

          if git diff --cached --quiet; then
            # Nothing changed. Still touch a marker if we are drifting toward
            # the 60-day disable, so the schedule cannot silently die.
            LAST=$(git log -1 --format=%ct)
            AGE=$(( ( $(date +%s) - LAST ) / 86400 ))
            if [ "$AGE" -ge 40 ]; then
              date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
              git add .github/keepalive
              git commit -m "chore: keepalive (${AGE}d since last commit)"
              git push
            else
              echo "no changes; last commit ${AGE}d ago, keepalive not needed"
            fi
          else
            NEW=$(python -c "import json;print(json.load(open('data/MANIFEST.json'))['events_new'])")
            BLOCK=$(python -c "import json;print(json.load(open('data/MANIFEST.json'))['block'])")
            git commit -m "data: sweep @ block ${BLOCK} (${NEW} new events)"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          if [ -f data/MANIFEST.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("data/MANIFEST.json"))
          print(f"### sweep {m['generated_utc']} — block {m['block']}\n")
          print(f"- status **{m['run_status']}**, {m['duration_seconds']}s, "
                f"{m['subnets_total']} subnets ({m['subnets_failed']} failed)")
          print(f"- **{m['events_new']} new events**, {m['events_still_open']} still open")
          print(f"- {m['ranked']} ranked, gated: {m['gated']}")
          PY
          else
            echo "### sweep FAILED — no MANIFEST.json written" >> "$GITHUB_STEP_SUMMARY"
          fi
